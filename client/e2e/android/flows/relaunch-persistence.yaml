# App lifecycle: the server list must survive a full process restart.
# launchApp force-stops the app first, so this asserts the added server
# (identified by its address, passed as SS_HOSTPORT) is restored from
# storage in a fresh process. Runs last; prior flows leave the app
# disconnected, so the connect button is also asserted.
appId: org.outline.android.client
name: android-vpn-relaunch-persistence
---
- launchApp
- tapOn:
    text: "(?i)got it"
    optional: true
- extendedWaitUntil:
    visible:
      text: ${SS_HOSTPORT}
    timeout: 15000
- assertVisible:
    text: "(?i)^connect$"
- takeScreenshot: relaunch-persistence
