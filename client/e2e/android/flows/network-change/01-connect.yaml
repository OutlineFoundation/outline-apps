# Vpn.AutoReconnect scenario, step 1/3: establish the tunnel. The scenario is
# split into three flows because the network toggle between them must happen
# via `adb shell cmd connectivity airplane-mode` (run_flows.sh) — Maestro's
# setAirplaneMode flips the settings value without dropping connectivity on
# modern API levels. Runs after vpn-smoke: server added, app disconnected.
appId: org.outline.android.client
name: android-network-change-01-connect
---
- launchApp
- tapOn:
    text: "(?i)got it"
    optional: true
- extendedWaitUntil:
    visible:
      text: "(?i)^connect$"
    timeout: 15000
- tapOn:
    text: "(?i)^connect$"
- tapOn:
    text: "(?i)^ok$"
    optional: true
- tapOn:
    text: "(?i)got it"
    optional: true
# The expanded server card exposes the connection state as text.
- extendedWaitUntil:
    visible:
      text: "(?i)^connected$"
    timeout: 30000
