# Vpn.AutoReconnect scenario, step 3/3: the runner has just disabled airplane
# mode. The tunnel must recover on its own, then disconnect cleanly so later
# flows start from the disconnected state. The runner additionally asserts
# fresh post-recovery connectivity probes in the hermetic ss-server's log.
appId: org.outline.android.client
name: android-network-change-03-recovery
---
# The network transition can raise the same transient ANR as the outage step.
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible:
      text: "(?i)^connected$"
    timeout: 60000
- takeScreenshot: reconnected
- tapOn:
    text: "(?i)^disconnect$"
- extendedWaitUntil:
    visible:
      text: "(?i)^connect$"
    timeout: 20000
