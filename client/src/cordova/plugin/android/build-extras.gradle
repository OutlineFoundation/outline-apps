android {
  // Native-library symbol stripping. AGP's mergeNativeLibs step strips the
  // debug symbols out of the .so files it packages (tun2socks' libgojni.so, the
  // Sentry native libs) -- but only when it can find a compatible NDK's
  // llvm-strip. Cordova generates this app module without an ndkVersion, so AGP
  // logs "Unable to strip the following libraries, packaging them as they are"
  // and ships the unstripped ~12MB-per-ABI libgojni.so. Pin the installed NDK
  // (client/src/cordova/android/README.md) so the strip runs: the AAB/APK gets
  // the small stripped .so, while the unstripped copy survives only in the
  // .aar, which is where upload_debug_symbols reads it for Sentry
  // symbolication.
  ndkVersion "28.2.13676358"

  // 16KB page-size support: package native libraries uncompressed and
  // page-aligned. This is the AGP default, but the app module is generated by
  // Cordova, so we set it explicitly here (matching the OutlineAndroidLib
  // module) to guard against the packaging regressing to legacy behavior.
  packagingOptions {
    jniLibs {
      useLegacyPackaging false
    }
  }

  // Enable R8 code shrinking/obfuscation and resource shrinking on the app
  // module. Cordova generates this module without any minification, so this is
  // the only project-controlled hook to shrink the shipped APK/AAB. The keep
  // rules that protect our reflectively-instantiated / JNI / AIDL classes live
  // in OutlineAndroidLib's consumer-rules.pro, which propagates to this R8 run.
  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
    }
  }
}

repositories {
  maven {
    // This is relative to $WORKSPACE/client/platforms/android/
    url = uri(layout.settingsDirectory.dir("../../../output/client/android"))
  }
}

dependencies {
  // From --include-build.
  implementation 'org.outline:outline:0.0'
  // From local Maven directory.
  implementation 'org.getoutline.client:tun2socks:0.0.1'
}
