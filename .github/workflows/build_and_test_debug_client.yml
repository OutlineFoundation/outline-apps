name: Build and Test / Client

concurrency:
  group: '${{ github.head_ref || github.ref }} Client'
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - master
  schedule:
    - cron: "0 13 * * *"  # Run daily at 1PM UTC.

jobs:
  web_test:
    name: Web Test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install NPM Dependencies
        run: npm set cache .npm && npm ci

      - name: Build Web App
        run: npm run action client/web/build

      - name: Test Web App
        run: npm run action client/web/test

      # - uses: codecov/codecov-action@v3
      #   with:
      #     files: ./client/src/output/coverage/www/coverage-final.json
      #     flags: unittests, www

  shared_ui_e2e_test:
    name: Shared UI E2E Test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install NPM Dependencies
        run: npm set cache .npm && npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Shared UI E2E Suite
        run: npm run action client/e2e/test

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/e2e/playwright-report/
          retention-days: 7

  backend_test:
    name: Go Backend Test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version-file: '${{ github.workspace }}/go.mod'

      - name: Test Go Backend
        run: go test -race -bench=. -benchtime=100ms ./client/...

      - name: Test Go Transport E2E
        run: go test -C client/go/e2etest -race ./...

  electron_e2e_test:
    name: Electron E2E Test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install NPM Dependencies
        run: npm set cache .npm && npm ci

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version-file: '${{ github.workspace }}/go.mod'

      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
          use-cache: false

      - name: Install System Dependencies
        run: npx playwright install-deps chromium

      - name: Run Electron E2E Suite
        run: xvfb-run --auto-servernum -- npm run action client/e2e/electron/test

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-electron
          path: client/e2e/playwright-report-electron/
          retention-days: 7

  electron_debug_build:
    name: ${{ matrix.name }} Debug Build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    needs: [web_test, backend_test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: linux
            arch: x64
            runner: ubuntu-22.04
            timeout: 20
          - name: Linux arm64
            platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            timeout: 20
            # puppeteer 13 has no arm64 chromium; install system chromium so
            # its postinstall finds one.
            installChromium: true
            # fpm ("Effing Package Manager") is what electron-builder
            # invokes to produce the Linux .deb. It bundles an x86 fpm
            # binary only, so the arm64 runner has to install a native fpm
            # via gem and tell electron-builder to use it. Workaround from:
            # https://github.com/jordansissel/fpm/issues/1801#issuecomment-919877499
            useSystemFpm: true
            # We use windows-2022 instead of windows-2025 because windows-2025
            # includes Visual Studio 2026, which causes a buffer overflow crash
            # in the node-gyp version (v10.1.0) bundled with Node 22.
          - name: Windows ia32
            platform: windows
            arch: ia32
            runner: windows-2022
            timeout: 40
          - name: Windows arm64
            platform: windows
            arch: arm64
            runner: windows-2022
            timeout: 40
    steps:
      - name: Support longpaths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install Chromium
        if: matrix.installChromium
        run: sudo apt update && sudo apt install chromium-browser

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version-file: '${{ github.workspace }}/go.mod'

      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
          use-cache: false

      - name: Install system fpm
        # Export USE_SYSTEM_FPM from this conditional step rather than via the
        # build step's `env:` block. `env:` would always *define* the variable
        # (with an empty value for non-fpm matrices), and app-builder treats
        # any defined USE_SYSTEM_FPM as a request to use system fpm.
        if: matrix.useSystemFpm
        run: |
          sudo gem install fpm
          echo "USE_SYSTEM_FPM=true" >> $GITHUB_ENV

      - name: Build Client
        run: npm run action client/electron/build ${{ matrix.platform }} -- --arch ${{ matrix.arch }}

  macos_debug_build:
    name: MacOS Debug Build
    runs-on: macos-15
    timeout-minutes: 20
    needs: [web_test, backend_test]
    steps:
      - name: Display XCode
        run: xcode-select --print-path

      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version-file: '${{ github.workspace }}/go.mod'

      - name: Build Tun2Socks (required for Test OutlineAppleLib)
        run: npm run action client/src/tun2socks/build macos

      - name: Test OutlineAppleLib
        run: npm run action client/src/cordova/test macos

      - name: Build MacOS Client
        run: npm run action client/src/cordova/build macos

      # - uses: codecov/codecov-action@v4
      #   with:
      #     file: ./client/src/output/coverage/apple/macos/TestResult.xcresult
      #     flags: unittests, apple, macos

  ios_debug_build:
    name: iOS Debug Build
    runs-on: macos-15
    timeout-minutes: 20
    needs: [web_test, backend_test]
    steps:
      - name: Display XCode
        run: xcode-select --print-path

      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version-file: '${{ github.workspace }}/go.mod'

      - name: Build Tun2Socks (required for Test OutlineAppleLib)
        run: npm run action client/src/tun2socks/build ios

      - name: Test OutlineAppleLib
        run: npm run action client/src/cordova/test ios

      - name: Build iOS Client
        run: npm run action client/src/cordova/build ios

      # - uses: codecov/codecov-action@v4
      #   with:
      #     file: ./client/src/output/coverage/apple/ios/TestResult.xcresult
      #     flags: unittests, apple, ios

  android_debug_build:
    name: Android Debug Build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [web_test, backend_test]
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Setup Java
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Android Client
        run: npm run action client/src/cordova/build android -- --verbose

  notify_scheduled_failure:
    name: Report Scheduled Failure
    runs-on: ubuntu-22.04
    # Depend on the leaf jobs; with failure() this fires if anything in the
    # (transitive) needs graph failed, so a broken web_test/backend_test still
    # surfaces here via the build jobs that depend on them.
    needs:
      [
        shared_ui_e2e_test,
        electron_e2e_test,
        electron_debug_build,
        macos_debug_build,
        ios_debug_build,
        android_debug_build,
      ]
    # Only scheduled runs file an issue; PR failures are already visible on the PR.
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="ci-nightly-failure"
          {
            echo "The scheduled \"Build and Test / Client\" workflow failed."
            echo
            echo "- Branch: \`$REF\`"
            echo "- Commit: $SHA"
            echo "- Run: $RUN_URL"
          } > body.md
          # Reuse an existing open issue so repeated failures don't spam new ones.
          existing=$(gh issue list --repo "$REPO" --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file body.md
          else
            gh label create "$label" --repo "$REPO" --color b60205 \
              --description "Scheduled CI failure" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "Scheduled client CI failed" \
              --label "$label" --body-file body.md
          fi
