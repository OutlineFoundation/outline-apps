# Nightly Manager E2E tiers (QA automation Layers 2 and 3, see
# docs/manager-qa-automation-plan.md): suites that are too slow or too
# heavyweight for per-PR CI — a real Shadowbox container and the real
# Electron app.
#
# `workflow_dispatch` exists so changes can be validated on a branch: GitHub
# only runs `schedule` triggers from the default branch.

name: Nightly Manager E2E

concurrency:
  group: '${{ github.head_ref || github.ref }} Nightly Manager E2E'
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 14 * * *' # Daily at 2PM UTC, after the 1PM Build and Test run.
  workflow_dispatch: {}

jobs:
  real_shadowbox_e2e:
    name: Real Shadowbox E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install NPM Dependencies
        run: npm set cache .npm && npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Real-Shadowbox E2E Journey
        run: npm run action server_manager/e2e/test_real

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-shadowbox-playwright-report
          path: server_manager/e2e/playwright-report
          retention-days: 14

  linux_electron_e2e:
    name: Linux Electron E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install NPM Dependencies
        run: npm set cache .npm && npm ci

      - name: Install System Dependencies
        run: npx playwright install-deps chromium

      - name: Run Electron E2E Suite
        # Electron needs a display server; xvfb provides a virtual one.
        run: xvfb-run --auto-servernum npm run action server_manager/e2e/test_electron

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-playwright-report
          path: server_manager/e2e/playwright-report
          retention-days: 14
